name: Enrich Wiktionary

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          pip install requests

      - run: |
          python scripts/enrich_wiktionary.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add words/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Enrich first 50 words from Wiktionary"
          git push
